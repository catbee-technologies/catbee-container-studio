name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_BUILDER_UPDATE_SIGN_KEY: ${{ secrets.ELECTRON_BUILDER_UPDATE_SIGN_KEY }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist:win -- --publish always

          - os: macos-latest
            platform: macos
            command: npm run dist:mac -- --publish always

          - os: ubuntu-latest
            platform: linux
            command: npm run dist:linux -- --publish always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Validate tag matches package.json version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '${PKG_VERSION}'!"
            echo "Expected tag: '${EXPECTED_TAG}'"
            echo "Please use 'npm version <version>' to create and bump release tags properly."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.command }}

      - name: List build output
        shell: bash
        run: |
          echo "Build output for ${{ matrix.platform }}:"
          find build -maxdepth 2 -type f -print

  release:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    needs: build

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Generating changelog for ${TAG}"
          node scripts/generate-changelog.mjs --tag "${TAG}" --repo "${REPOSITORY}" --output changelog.md

          echo "Generated changelog:"
          cat changelog.md

      - name: Generate contributors
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Fallback to previous_tag.txt if PREVIOUS_TAG is not yet populated
          if [[ -z "${PREVIOUS_TAG:-}" && -f "previous_tag.txt" ]]; then
            PREVIOUS_TAG="$(cat previous_tag.txt | tr -d '[:space:]')"
          fi

          echo "Resolved previous tag: '${PREVIOUS_TAG:-}'"

          if [[ -n "${PREVIOUS_TAG:-}" ]]; then
            CONTRIBUTORS="$(
              gh api \
                "repos/${REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}" \
                --paginate \
                --jq '.commits[].author.login // empty' 2>/dev/null |
              grep -Ev '(\[bot\]|github-actions)' |
              sort -fu |
              sed 's/^/- **@/' |
              sed 's/$/**/' || true
            )"
          else
            CONTRIBUTORS="$(
              gh api \
                "repos/${REPOSITORY}/commits?sha=${TAG}" \
                --paginate \
                --jq '.[].author.login // empty' 2>/dev/null |
              grep -Ev '(\[bot\]|github-actions)' |
              sort -fu |
              sed 's/^/- **@/' |
              sed 's/$/**/' || true
            )"
          fi

          if [[ -z "$CONTRIBUTORS" ]]; then
            CONTRIBUTORS="- **@${REPOSITORY%%/*}**"
          fi

          echo "Generated contributors:"
          echo "$CONTRIBUTORS"

          {
            echo 'CONTRIBUTORS<<EOF'
            echo "$CONTRIBUTORS"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}"

          cat > release-notes.md <<EOF
          ## CatBee Container Studio ${TAG}

          A new release of **CatBee Container Studio** with new features, improvements, and fixes.

          $(cat changelog.md)

          **📋 Full Changelog**: ${FULL_CHANGELOG_URL}

          ### 📦 Downloads

          #### 🪟 Windows

          - **Windows x64 Installer** — [Download .exe](${BASE_URL}/CatBee-Container-Studio-${VERSION}-win-x64.exe)
          - **Windows x64 Portable** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-win-x64.zip)

          **Microsoft Store**

          Install CatBee Container Studio directly from the Microsoft Store:

          <a href="https://apps.microsoft.com/detail/9NX6H3J2RNX2?referrer=appbadge&mode=full" target="_blank"  rel="noopener noreferrer"><img src="https://get.microsoft.com/images/en-us%20dark.svg" width="150"/></a>

          #### 🍎 macOS

          - **macOS Universal (Intel + Apple Silicon)** — [Download .dmg](${BASE_URL}/CatBee-Container-Studio-${VERSION}-mac-universal.dmg)
          - **macOS Universal (Intel + Apple Silicon)** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-mac-universal.zip)

          #### 🐧 Linux

          - **Linux x64 DEB** — [Download .deb](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-amd64.deb)
          - **Linux x64 RPM** — [Download .rpm](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-x86_64.rpm)
          - **Linux x64 AppImage** — [Download AppImage](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-x86_64.AppImage)
          - **Linux x64 TAR.GZ** — [Download .tar.gz](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-x64.tar.gz)

          ### 🛠️ Installation

          #### 🪟 Windows

          Download the \`.exe\` installer and run it.

          #### 🍎 macOS

          Download the \`.dmg\`, open it, and drag **CatBee Container Studio** to the **Applications** folder.

          > **Note:** If macOS displays a security warning because the application is not signed or notarized, you may need to allow it in **System Settings → Privacy & Security** or remove the quarantine attribute using:
          > \`xattr -d com.apple.quarantine "/Applications/CatBee Container Studio.app"\`

          #### 🐧 Linux

          **Debian/Ubuntu:** Download the \`.deb\` package and install it using your package manager.

          **Fedora/RHEL/openSUSE:** Download the \`.rpm\` package and install it using your package manager.

          **Snap:** Install **CatBee Container Studio** from the Ubuntu App Center or Snap Store.

          **Other distributions:** Download the \`.AppImage\`, make it executable, and run it: \`chmod +x CatBee-Container-Studio-*.AppImage && ./CatBee-Container-Studio-*.AppImage\`

          Alternatively, download the \`.tar.gz\` archive, extract it, and run the application.

          ### 🔄 Updates

          On macOS, download the latest \`.dmg\` and replace the app in **Applications**.

          Use **Settings → Software Updates** for the Windows installer and Linux AppImage, DEB, and RPM packages. For Windows ZIP and Linux TAR.GZ downloads, replace the extracted application with the latest archive.

          ### 👥 Contributors

          ${CONTRIBUTORS}
          EOF

          echo "Generated release notes:"
          cat release-notes.md

      - name: Determine release type
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
