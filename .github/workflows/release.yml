name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist:win

          - os: macos-latest
            platform: macos
            command: npm run dist:mac

          - os: ubuntu-latest
            platform: linux
            command: npm run dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.command }}

      - name: List build output
        shell: bash
        run: |
          echo "Build output for ${{ matrix.platform }}:"
          find build -maxdepth 2 -type f -print

      - name: Upload Windows build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            build/*.exe
            build/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS build
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux build
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            build/*.deb
            build/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: release/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: release/macos

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: release/linux

      - name: List release files
        shell: bash
        run: |
          echo "Release files:"
          find release -type f -print

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}"

          cat > release-notes.md <<EOF
          ## CatBee Container Studio

          Release \`${TAG}\`

          ### Downloads

          #### Windows

          - **Windows x64 Installer** — [Download .exe](${BASE_URL}/CatBee-Container-Studio-${VERSION}-win-x64.exe)
          - **Windows x64 Portable** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-win-x64.zip)

          #### macOS

          - **macOS Universal (Intel + Apple Silicon)** — [Download .dmg](${BASE_URL}/CatBee-Container-Studio-${VERSION}-mac-universal.dmg)
          - **macOS Universal (Intel + Apple Silicon)** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-mac-universal.zip)

          #### Linux

          - **Linux x64 DEB** — [Download .deb](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-amd64.deb)
          - **Linux x64 ZIP** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-x64.zip)

          ### Installation

          #### Windows
          Download the \`.exe\` installer and run it.

          #### macOS
          Download the \`.dmg\`, open it, and drag **CatBee Container Studio** to the **Applications** folder.

          > **Note:** If macOS displays a security warning because the application is not signed or notarized, you may need to allow it in **System Settings → Privacy & Security** or remove the quarantine attribute using:
          >
          > ```bash
          > xattr -d com.apple.quarantine "/Applications/CatBee Container Studio.app"
          > ```

          #### Linux

          **Debian/Ubuntu:**
          Install the \`.deb\` package using your package manager.

          **Other distributions:**
          Download and extract the \`.zip\` archive.
          EOF

      - name: Determine release type
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/windows/**
            release/macos/**
            release/linux/**
          draft: true
          prerelease: ${{ steps.release.outputs.prerelease }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
