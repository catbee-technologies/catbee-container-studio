name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist:win -- --publish always

          - os: macos-latest
            platform: macos
            command: npm run dist:mac -- --publish always

          - os: ubuntu-latest
            platform: linux
            command: npm run dist:linux -- --publish always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.command }}

      - name: List build output
        shell: bash
        run: |
          echo "Build output for ${{ matrix.platform }}:"
          find build -maxdepth 2 -type f -print

  snap:
    name: Publish Snap
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Verify Snapcraft
        run: snapcraft --version

      - name: Determine Snap channel
        id: snap
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Snap
        env:
          SNAP_CHANNEL: ${{ steps.snap.outputs.channel }}
        run: |
          npm run package
          npx electron-builder \
            --linux snap \
            --config electron-builder.config.mjs \
            --publish always \
            -c.snapcraft.publish.channels="${SNAP_CHANNEL}"

  release:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}"

          cat > release-notes.md <<EOF
          ## CatBee Container Studio

          Release \`${TAG}\`

          ### Downloads

          #### Windows

          - **Windows x64 Installer** — [Download .exe](${BASE_URL}/CatBee-Container-Studio-${VERSION}-win-x64.exe)
          - **Windows x64 Portable** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-win-x64.zip)

          #### macOS

          - **macOS Universal (Intel + Apple Silicon)** — [Download .dmg](${BASE_URL}/CatBee-Container-Studio-${VERSION}-mac-universal.dmg)
          - **macOS Universal (Intel + Apple Silicon)** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-mac-universal.zip)

          #### Linux

          - **Linux x64 DEB** — [Download .deb](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-amd64.deb)
          - **Linux x64 ZIP** — [Download .zip](${BASE_URL}/CatBee-Container-Studio-${VERSION}-linux-x64.zip)

          ### Installation

          #### Windows

          Download the \`.exe\` installer and run it.

          #### macOS

          Download the \`.dmg\`, open it, and drag **CatBee Container Studio** to the **Applications** folder.

          > **Note:** If macOS displays a security warning because the application is not signed or notarized, you may need to allow it in **System Settings → Privacy & Security** or remove the quarantine attribute using:
          > \`xattr -d com.apple.quarantine "/Applications/CatBee Container Studio.app"\`

          #### Linux

          **Debian/Ubuntu:**

          Install the \`.deb\` package using your package manager.

          **Snap:**

          Install **CatBee Container Studio** from the Ubuntu App Center or Snap Store.

          **Other distributions:**

          Download and extract the \`.zip\` archive.

          ### Updates

          CatBee Container Studio supports automatic updates.
          Use **Help → Check for Updates...** to manually check for a new release.
          EOF

      - name: Determine release type
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
