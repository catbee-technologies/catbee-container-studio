name: CI
run-name: CI for ${{ github.repository }} on ${{ github.ref_name }}

on:
  push:
    branches:
      - '**'

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - '**'

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 26

    if: >
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.draft == false &&
          !contains(github.event.pull_request.title, 'WIP') &&
          !contains(github.event.pull_request.title, 'Work in progress') &&
          !contains(github.event.pull_request.title, '🚧')
        )
      )

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci && cd frontend && npm ci

      - name: Run Electron linting
        run: npm run lint

      - name: Build Electron application
        run: npm run build

      - name: Run Angular linting
        run: npm run lint:ui

      - name: Build Angular application
        run: npm run build:ui
