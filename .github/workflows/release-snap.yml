name: Release Snap

on:
  push:
    branches:
      - release/snap

permissions:
  contents: read

jobs:
  snap:
    name: Publish Snap
    runs-on: ubuntu-latest

    env:
      SNAP_CSC_LINK: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd frontend
          npm ci

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Verify Snapcraft
        run: |
          snapcraft --version
          lxc version

      - name: Build and publish Snap
        id: build_snap
        continue-on-error: true
        run: |
          npm run package
          npm run dist:linux:snap -- --publish always -c.snapcraft.publish.channels="stable"

      - name: Upload Snap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catbee-container-studio-snap
          path: build/**/*.snap
          retention-days: 7
          if-no-files-found: error

      - name: Fail if Snap build or publish failed
        if: steps.build_snap.outcome == 'failure'
        run: |
          echo "Snap build or publishing failed."
          exit 1
