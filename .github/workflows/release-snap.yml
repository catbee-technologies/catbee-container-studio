name: Release Snap

on:
  push:
    branches:
      - release/snap

permissions:
  contents: read

jobs:
  snap:
    name: Publish Snap
    runs-on: ubuntu-latest

    env:
      SNAP_CSC_LINK: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd frontend
          npm ci

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Verify Snapcraft
        run: snapcraft --version

      - name: Build and publish Snap
        run: |
          npm run package
          npm run dist:linux:snap -- --publish always -c.snapcraft.publish.channels="stable"
