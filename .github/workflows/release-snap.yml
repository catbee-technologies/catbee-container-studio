name: Release Snap

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  snap:
    name: Publish Snap
    runs-on: ubuntu-latest

    env:
      SNAP_CSC_LINK: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          cd frontend
          npm ci

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Verify Snapcraft
        run: snapcraft --version

      - name: Determine Snap channel
        id: snap
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish Snap
        env:
          SNAP_CHANNEL: ${{ steps.snap.outputs.channel }}
        run: |
          npm run package
          npm run dist:linux:snap -- --publish always -c.snapcraft.publish.channels="${SNAP_CHANNEL}"
