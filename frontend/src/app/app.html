<div class="desktop-shell">
  <catbee-container-studio-window-header />
  <div class="workspace">
    <aside class="sidebar" [class.is-collapsed]="sidebarCollapsed()" aria-label="Primary navigation">
      <button
        type="button"
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand' : 'Collapse'"
        [catbeeTooltip]="sidebarCollapsed() ? 'Expand' : 'Collapse'"
        catbeeTooltipPosition="right"
      >
        <span class="mat-icon-filled" aria-hidden="true">
          {{ sidebarCollapsed() ? 'right_panel_open' : 'left_panel_close' }}
        </span>
      </button>

      <nav>
        <ul>
          @for (item of navItems; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: false }"
                class="nav-link"
                [attr.aria-label]="item.label"
                [catbeeTooltip]="item.label"
                catbeeTooltipPosition="right"
                [catbeeTooltipDisabled]="!sidebarCollapsed()"
                (click)="onNavClick($event)"
              >
                <span class="mat-icon-filled" aria-hidden="true">{{ item.icon }}</span>
                @if (!sidebarCollapsed()) {
                  <span>{{ item.label }}</span>
                }
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>

    <main class="content-pane" aria-label="Main content">
      @if (dockerConnected()) {
        <router-outlet />
      } @else {
        @let status = dockerInitStatus();
        @let error = dockerErrorStatus();
        @let initializing = isDockerInitializing();

        <catbee-container-studio-empty-state
          icon="cloud_off"
          size="large"
          [message]="error ? error.message : initializing ? status.message : 'Docker Engine is not connected'"
          [hint]="
            error
              ? error.hint
              : initializing
                ? status.hint
                : 'Please start Docker Engine to manage your containers, images, and volumes.'
          "
          [showLoader]="initializing"
        />
      }
    </main>
  </div>
  <catbee-container-studio-footer [dockerConnected]="dockerConnected()" />
</div>
