<section class="overview">
  <div class="metric metric-state">
    <span class="label">State</span>
    <span
      class="container-status state"
      [class.running]="container().State === 'running'"
      [class.stopped]="container().State !== 'running'"
    >
      {{ container().State }}
    </span>
  </div>

  <div class="metric metric-ports">
    <catbee-container-studio-port-list
      [ports]="container().Ports"
      [containerState]="container().State"
      noPortsLabel="No Ports"
    />
  </div>

  <div class="metric">
    <span class="label">CPU</span>
    <span class="value mono">{{ formatCpu(stats()) }}</span>
  </div>

  <div class="metric">
    <span class="label">Memory</span>
    <span class="value mono">{{ formatMemory(stats()) }}</span>
  </div>
</section>
