<div class="logs-toolbar">
  <div class="logs-toolbar-left">
    <catbee-container-studio-search-input
      #logsSearchInput
      placeholder="Search Logs"
      ariaLabel="Search Logs"
      [value]="logsSearchInputTerm()"
      (valueChange)="setSearch($event)"
      (inputKeydown)="onSearchKeydown($event)"
      width="20rem"
    >
      <button
        type="button"
        search-controls
        class="search-mode-btn"
        [class.active]="logsSearchMode().caseSensitive"
        (click)="toggleCaseSensitive()"
        [catbeeTooltip]="'Case sensitive'"
        [catbeeTooltipPosition]="'bottom'"
        [catbeeTooltipDelay]="tooltipDelay"
        aria-label="Case sensitive"
      >
        Aa
      </button>
      <button
        type="button"
        search-controls
        class="search-mode-btn"
        [class.active]="logsSearchMode().wholeWord"
        (click)="toggleWholeWord()"
        [catbeeTooltip]="'Whole word'"
        [catbeeTooltipPosition]="'bottom'"
        [catbeeTooltipDelay]="tooltipDelay"
        aria-label="Whole word"
      >
        W
      </button>
      <button
        type="button"
        search-controls
        class="search-mode-btn"
        [class.active]="logsSearchMode().regex"
        (click)="toggleRegex()"
        [catbeeTooltip]="'Regex'"
        [catbeeTooltipPosition]="'bottom'"
        [catbeeTooltipDelay]="tooltipDelay"
        aria-label="Regex"
      >
        .*
      </button>
    </catbee-container-studio-search-input>
    @if (logsSearchInputTerm().trim().length > 0) {
      <div class="search-nav">
        <button type="button" class="catbee-action-btn search-nav-btn" (click)="prevMatch()" [disabled]="!hasMatches()">
          <span class="mat-icon-filled" aria-hidden="true">keyboard_arrow_up</span>
        </button>
        <button type="button" class="catbee-action-btn search-nav-btn" (click)="nextMatch()" [disabled]="!hasMatches()">
          <span class="mat-icon-filled" aria-hidden="true">keyboard_arrow_down</span>
        </button>
        <span class="match-count" [class.warn]="hasRegexError()">{{ matchSummary() }}</span>
      </div>
    }
  </div>

  <div class="logs-toolbar-right">
    <button type="button" class="catbee-action-btn fix-height" (click)="copyLogs()">
      {{ copyButtonLabel() }}
    </button>
    <button type="button" class="catbee-action-btn fix-height" (click)="clearLogs()">
      {{ clearButtonLabel() }}
    </button>

    <catbee-container-studio-menu
      [open]="showLogOptions()"
      [style]="{ width: '13rem' }"
      (dismissed)="closeLogOptions()"
    >
      <button menuTrigger type="button" class="catbee-action-btn fix-height" (click)="toggleLogOptions($event)">
        <span class="mat-icon-filled" aria-hidden="true">tune</span>
        Options
      </button>

      <div menuContent class="logs-options-menu">
        <label class="menu-item menu-item-checkbox no-select pointer">
          <catbee-container-studio-table-checkbox
            [checked]="displayOptions().showTimestamps"
            (checkedChange)="toggleLogTimestamps()"
            size="small"
          />
          Show timestamp
        </label>
        <label class="menu-item menu-item-checkbox no-select pointer">
          <catbee-container-studio-table-checkbox
            [checked]="displayOptions().wrapLines"
            (checkedChange)="toggleWrapLines()"
            size="small"
          />
          Wrap lines
        </label>
        <label class="menu-item menu-item-checkbox no-select pointer">
          <catbee-container-studio-table-checkbox
            [checked]="displayOptions().localDates"
            (checkedChange)="toggleConvertDatesToLocal()"
            size="small"
          />
          Local dates
        </label>
        <label class="menu-item menu-item-select no-select" for="logs-tail-lines-select">
          Tail lines
          <select id="logs-tail-lines-select" class="logs-tail-select pointer" (change)="onTailLinesChange($event)">
            @for (lines of tailLineOptions(); track lines) {
              <option [value]="lines" [selected]="lines === selectedTailLines()">{{ lines }}</option>
            }
          </select>
        </label>
      </div>
    </catbee-container-studio-menu>
  </div>
</div>

<section #tabScrollArea class="logs-scroll-panel" role="tabpanel" (scroll)="onPanelScroll()">
  @if (logEntries().length === 0) {
    <catbee-container-studio-empty-state
      [icon]="'article'"
      [message]="(externalLogs() !== null ? externalLoading() : isLoading()) ? 'Loading logs...' : 'No logs yet.'"
      [hint]="
        (externalLogs() !== null ? externalLoading() : isLoading())
          ? 'Connecting to container log stream...'
          : 'Logs will appear here once the container emits output.'
      "
    />
  } @else {
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div class="log-terminal" [class.wrap-off]="!displayOptions().wrapLines" (click)="onLogClick($event)">
      @for (lineHtml of renderedLogLinesHtml(); track $index) {
        <div class="log-line" [innerHTML]="lineHtml"></div>
      }
    </div>
  }
</section>

<div class="scroll-actions">
  @if (isScrollable()) {
    @if (isNearBottom()) {
      <button type="button" class="catbee-action-btn" (click)="scrollToTop()">
        <span class="mat-icon-filled" aria-hidden="true">keyboard_arrow_up</span>
      </button>
    } @else {
      <button type="button" class="catbee-action-btn" (click)="scrollToBottom()">
        <span class="mat-icon-filled" aria-hidden="true">keyboard_double_arrow_down</span>
      </button>
    }
  }
</div>
