<main class="catbee-outer-container" aria-label="Docker volumes">
  <header class="catbee-container-list-header">
    <div>
      <h1>Volumes</h1>
    </div>
    <div class="actions">
      <button
        type="button"
        class="refresh-btn"
        (click)="loadVolumes()"
        [disabled]="isRefreshing()"
        aria-label="Refresh volumes"
        [catbeeTooltip]="'Refresh'"
        [catbeeTooltipPosition]="'left'"
        [catbeeTooltipDelay]="tooltipDelay"
      >
        <span class="mat-icon-filled" [class.is-refreshing]="isRefreshing()" aria-hidden="true">refresh</span>
      </button>
      <div class="badges-row">
        <span class="badge total">Total: {{ volumes().length }}</span>
        @if (totalUsedSize() > 0) {
          <span class="badge size">{{ formatSize(totalUsedSize()) }}</span>
        }
      </div>
    </div>
  </header>

  @if (error(); as err) {
    <catbee-container-studio-error-banner [errorMessage]="err" (closeErr)="error.set(null)" size="small" />
  }

  <section class="catbee-list-toolbar catbee-base-panel" aria-label="Volume controls">
    <div class="catbee-list-toolbar-left">
      <catbee-container-studio-search-input
        #volumeSearchInput
        placeholder="Search Volumes"
        ariaLabel="Search Volumes"
        [value]="searchTerm()"
        (valueChange)="setSearchTerm($event)"
        width="20rem"
      />
    </div>
    <div class="catbee-list-toolbar-right">
      <catbee-container-studio-segmented-filter
        ariaLabel="Filter volumes by usage"
        [options]="usageFilterOptions"
        [activeValue]="usageFilter()"
        (valueChange)="setUsageFilter($event)"
      />
      @if (selectedCount() > 0) {
        <span class="selection-count">Selected: {{ selectedCount() }}</span>
        <button type="button" class="catbee-action-btn danger" (click)="requestDeleteSelected()">
          <span class="mat-icon-filled" aria-hidden="true">delete</span>
          Delete Selected
        </button>
      }
      <button type="button" class="catbee-action-btn danger" (click)="requestPrune()">
        <span class="mat-icon-filled" aria-hidden="true">delete_sweep</span>
        Prune Unused
      </button>
    </div>
  </section>

  <div class="catbee-container-list-layout">
    <div class="catbee-container-list-body catbee-base-panel">
      @if (isLoading()) {
        <catbee-container-studio-empty-state [icon]="'database'" [message]="'Loading Volumes...'" />
      } @else {
        <catbee-container-studio-data-table
          [columns]="columns"
          [rows]="sortedVolumes()"
          [rowKey]="volumeKey"
          [storageKey]="'volumes'"
          ariaLabel="Volumes table"
          [clickableRows]="true"
          [wrapCells]="false"
          [sortKey]="sortKey()"
          [sortDirection]="sortDirection()"
          (sortChange)="onSortChange($event)"
          (rowClick)="openVolumeDetails($event.Name)"
          [emptyIcon]="'database'"
          [emptyMessage]="volumes().length === 0 ? 'No volumes found.' : 'No volumes match your search.'"
          [emptyHint]="
            volumes().length === 0
              ? 'Volumes will appear here once they are created.'
              : 'Try a different search term or filter.'
          "
        >
          <ng-template catbeeHeaderDef="checkbox">
            <catbee-container-studio-table-checkbox
              [checked]="allVisibleSelected()"
              [indeterminate]="partiallyVisibleSelected()"
              [ariaLabel]="'Select all visible volumes'"
              (checkedChange)="toggleSelectAllVisible()"
            />
          </ng-template>

          <ng-template catbeeColumnDef="checkbox" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            <catbee-container-studio-table-checkbox
              [checked]="selectedVolumeNames().has(volume.Name)"
              [ariaLabel]="'Select volume'"
              (checkedChange)="toggleVolumeSelection(volume.Name)"
            />
          </ng-template>

          <ng-template catbeeColumnDef="used" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            <span class="usage-dot" [class.used]="isUsed(volume.Name)" [class.unused]="!isUsed(volume.Name)"></span>
          </ng-template>

          <ng-template catbeeColumnDef="name" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            <button type="button" class="link-btn" (click)="openVolumeDetails(volume.Name)">
              {{ volume.Name }}
            </button>
          </ng-template>

          <ng-template catbeeColumnDef="driver" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            <span class="badge small driver-badge">{{ volume.Driver }}</span>
          </ng-template>

          <ng-template catbeeColumnDef="size" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            {{ formatSize(volume.UsageData?.Size ?? 0) }}
          </ng-template>

          <ng-template catbeeColumnDef="created" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            <catbee-container-studio-tooltip-date [date]="volume.CreatedAt" />
          </ng-template>

          <ng-template catbeeColumnDef="actions" [catbeeColumnDefRows]="sortedVolumes()" let-volume>
            <button
              type="button"
              class="catbee-action-btn icon-only danger"
              (click)="requestDeleteSingle(volume.Name)"
              aria-label="Delete volume"
              [catbeeTooltip]="'Delete'"
              [catbeeTooltipPosition]="'left'"
              [catbeeTooltipDelay]="tooltipDelay"
            >
              <span class="mat-icon-filled" aria-hidden="true">delete</span>
            </button>
          </ng-template>
        </catbee-container-studio-data-table>
      }
    </div>
  </div>
</main>

<catbee-container-studio-confirm-dialog
  [open]="pendingDeleteVolumeNames().length > 0"
  [title]="pendingDeleteVolumeNames().length > 1 ? 'Delete Volumes' : 'Delete Volume'"
  [message]="'Delete ' + pendingDeleteLabel() + '? \n All data in these volumes will be permanently deleted.'"
  confirmLabel="Delete"
  [dangerous]="true"
  (confirm)="confirmDelete()"
  (cancelAction)="cancelDelete()"
/>

<catbee-container-studio-confirm-dialog
  [open]="confirmPruneOpen()"
  title="Prune Unused Volumes"
  [message]="'Delete all volumes not used by any container? \n All data in those volumes will be permanently deleted.'"
  confirmLabel="Prune"
  [dangerous]="true"
  (confirm)="confirmPrune()"
  (cancelAction)="cancelPrune()"
/>
