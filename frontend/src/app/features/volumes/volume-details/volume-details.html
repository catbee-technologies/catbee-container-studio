<main class="catbee-details-container" aria-label="Volume details">
  <header class="catbee-details-container-header">
    <button type="button" class="back-btn" (click)="backToVolumes()">
      <span class="mat-icon-filled" aria-hidden="true">chevron_left</span>
    </button>

    <div class="title-wrap">
      <h1>{{ volumeName() }}</h1>
    </div>

    @if (volume()) {
      <div class="details-header-actions">
        <div class="header-size" aria-label="Volume size">
          <span class="mat-icon-filled" aria-hidden="true">hard_drive</span>
          <span class="header-size-text">
            <span class="header-size-label">Size</span>
            <strong>{{ volumeSize() }}</strong>
          </span>
        </div>
      </div>
    }
  </header>

  @if (error(); as err) {
    <catbee-container-studio-error-banner [errorMessage]="err" (closeErr)="error.set(null)" />
  }

  @if (isLoading()) {
    <catbee-container-studio-empty-state [icon]="'hourglass_empty'" [message]="'Loading volume details...'" />
  } @else {
    <section class="catbee-base-panel summary">
      @for (item of summaryItems(); track item.label) {
        <article>
          <p class="label">{{ item.label }}</p>
          <p
            class="value"
            [catbeeTooltip]="item.value"
            [catbeeTooltipPosition]="'top'"
            [catbeeTooltipDelay]="tooltipDelay"
            [catbeeTooltipOnlyOnOverflow]="true"
          >
            {{ item.value }}
          </p>
        </article>
      }
    </section>

    <section class="catbee-base-panel tabs" aria-label="Volume tabs">
      <catbee-container-studio-tabs
        [tabs]="tabs"
        [activeTab]="activeTab()"
        ariaLabel="Volume details tabs"
        (activeTabChange)="setActiveTab($event)"
      />

      <section
        class="tab-panel"
        [class.catbee-container-list-layout]="activeTab() !== 'files'"
        [class.files-tab-panel]="activeTab() === 'files'"
        role="tabpanel"
      >
        @if (activeTab() === 'files') {
          <catbee-container-studio-volume-files-tab [volumeName]="volumeName()" />
        } @else {
          <catbee-container-studio-connected-containers-table
            [containers]="containersInUse()"
            [emptyMessage]="'No containers currently mount this volume.'"
            [emptyHint]="'Containers that mount this volume will appear here when running.'"
            [emptyIcon]="'folder_open'"
          />
        }
      </section>
    </section>
  }
</main>
