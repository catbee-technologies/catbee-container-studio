<catbee-container-studio-dialog
  [open]="open() && isDialogReady()"
  [title]="'Run a new container'"
  [style]="{ width: 'min(95vw, 50rem)' }"
  (closeDialog)="onClose()"
>
  <ng-container catbeeDialogBody>
    <div class="run-container-form">
      @if (error(); as errorMessage) {
        <catbee-container-studio-error-banner [errorMessage]="errorMessage" (closeErr)="error.set(null)" size="small" />
      }

      <label class="field">
        <span class="field-label">Image</span>
        <input id="image-name" type="text" class="field-input" placeholder="Image name" [value]="image()" readonly />
      </label>

      <label class="field">
        <span class="field-label">Container name</span>
        <input
          id="container-name"
          type="text"
          class="field-input"
          placeholder="Optional, auto-generated if empty"
          [value]="containerName()"
          (input)="containerName.set($any($event.target).value)"
        />
      </label>

      <section class="field-group">
        <header class="field-group-header">
          <span class="field-group-title">Ports</span>
        </header>

        <catbee-container-studio-port-mappings-editor
          [(rows)]="ports"
          [isLoading]="isLoadingPorts()"
          [disabled]="isSubmitting()"
        />
      </section>

      <section class="field-group">
        <header class="field-group-header">
          <span class="field-group-title">Volumes</span>
          <div class="field-group-actions">
            @if (volumes().length > 0) {
              <button
                type="button"
                class="catbee-action-btn fix-height"
                aria-label="Clear all volumes"
                [disabled]="isSubmitting()"
                (click)="clearVolumes()"
              >
                Clear all
              </button>
            }
            <button
              type="button"
              class="catbee-action-btn icon-only"
              aria-label="Add volume mapping"
              [disabled]="isSubmitting()"
              (click)="addVolume()"
            >
              <span class="mat-icon-filled" aria-hidden="true">add</span>
            </button>
          </div>
        </header>

        <catbee-container-studio-volume-mappings-editor
          [(rows)]="volumes"
          [disabled]="isSubmitting()"
          emptyMessage="No mounted volumes."
          emptyHint="The container will use its own filesystem only."
        />
      </section>

      <section class="field-group">
        <header class="field-group-header">
          <span class="field-group-title">Environment variables</span>
          <div class="field-group-actions">
            @if (envVars().length > 0) {
              <button
                type="button"
                class="catbee-action-btn fix-height"
                aria-label="Clear all environment variables"
                (click)="clearEnvVars()"
              >
                Clear all
              </button>
            }
            <button
              type="button"
              class="catbee-action-btn icon-only"
              aria-label="Add environment variable"
              (click)="addEnvVar()"
            >
              <span class="mat-icon-filled" aria-hidden="true">add</span>
            </button>
          </div>
        </header>

        <catbee-container-studio-env-variables-editor
          [(rows)]="envVars"
          [disabled]="isSubmitting()"
          [showPasteHint]="false"
          keyPlaceholder="Key"
          valuePlaceholder="Value"
          emptyHint="Paste the contents of an .env file to populate variables automatically."
        />
      </section>
    </div>
  </ng-container>

  <ng-container catbeeDialogFooter>
    <button type="button" class="catbee-action-btn" [disabled]="isSubmitting()" (click)="onClose()">Cancel</button>
    <button type="button" class="catbee-action-btn action-start" [disabled]="isSubmitting()" (click)="run()">
      <span class="mat-icon-filled" aria-hidden="true">play_arrow</span>
      {{ isSubmitting() ? 'Running...' : 'Run Container' }}
    </button>
  </ng-container>
</catbee-container-studio-dialog>
