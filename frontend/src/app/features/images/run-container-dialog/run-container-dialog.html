<catbee-container-studio-dialog
  [open]="open() && isDialogReady()"
  [title]="'Run a new container'"
  [closable]="!isSubmitting()"
  [style]="{ width: 'min(95vw, 50rem)' }"
  (closeDialog)="onClose()"
>
  <ng-container catbeeDialogBody>
    <form id="run-container-form" [formRoot]="runForm" class="run-container-form">
      @if (error(); as errorMessage) {
        <catbee-container-studio-error-banner [errorMessage]="errorMessage" (closeErr)="error.set(null)" size="small" />
      }

      <label class="field">
        <span class="field-label">Image</span>
        <input id="image-name" type="text" class="field-input" placeholder="Image name" [value]="image()" readonly />
      </label>

      <label class="field">
        <span class="field-label">Container name</span>
        <input
          id="container-name"
          type="text"
          class="field-input"
          placeholder="Optional, auto-generated if empty"
          [formField]="runForm.containerName"
        />
      </label>

      <section class="field-group">
        <header class="field-group-header">
          <span class="field-group-title">Ports</span>
        </header>

        <catbee-container-studio-port-mappings-editor
          [fields]="runForm.ports"
          [isLoading]="isLoadingPorts()"
          [disabled]="isSubmitting()"
        />
      </section>

      <section class="field-group">
        <header class="field-group-header">
          <span class="field-group-title">Volumes</span>
          <div class="field-group-actions">
            @if (volumes().length > 0) {
              <button
                type="button"
                class="catbee-action-btn fix-height"
                aria-label="Clear all volumes"
                [disabled]="isSubmitting()"
                (click)="clearVolumes()"
              >
                Clear all
              </button>
            }
            <button
              type="button"
              class="catbee-action-btn icon-only"
              aria-label="Add volume mapping"
              [disabled]="isSubmitting()"
              (click)="addVolume()"
            >
              <span class="mat-icon-filled" aria-hidden="true">add</span>
            </button>
          </div>
        </header>

        <catbee-container-studio-volume-mappings-editor
          [fields]="runForm.volumes"
          [disabled]="isSubmitting()"
          emptyMessage="No mounted volumes."
          emptyHint="The container will use its own filesystem only."
        />
      </section>

      <section class="field-group">
        <header class="field-group-header">
          <span class="field-group-title">Environment variables</span>
          <div class="field-group-actions">
            @if (envVars().length > 0) {
              <button
                type="button"
                class="catbee-action-btn fix-height"
                aria-label="Clear all environment variables"
                [disabled]="isSubmitting()"
                (click)="clearEnvVars()"
              >
                Clear all
              </button>
            }
            <button
              type="button"
              class="catbee-action-btn icon-only"
              aria-label="Add environment variable"
              [disabled]="isSubmitting()"
              (click)="addEnvVar()"
            >
              <span class="mat-icon-filled" aria-hidden="true">add</span>
            </button>
          </div>
        </header>

        <catbee-container-studio-env-variables-editor
          [fields]="runForm.envVars"
          [disabled]="isSubmitting()"
          [showPasteHint]="false"
          keyPlaceholder="Key"
          valuePlaceholder="Value"
          emptyHint="Paste the contents of an .env file to populate variables automatically."
        />
      </section>
    </form>
  </ng-container>

  <ng-container catbeeDialogFooter>
    <button type="button" class="catbee-action-btn" [disabled]="isSubmitting()" (click)="onClose()">Cancel</button>
    <button type="submit" form="run-container-form" class="catbee-action-btn action-start" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="mat-icon-filled spin" aria-hidden="true">refresh</span>Running...
      } @else {
        <span class="mat-icon-filled" aria-hidden="true">play_arrow</span>Run Container
      }
    </button>
  </ng-container>
</catbee-container-studio-dialog>

<catbee-container-studio-confirm-dialog
  [open]="showConfirmClose()"
  title="Cancel Container Creation?"
  message="Close this dialog and discard the container configuration?"
  confirmLabel="Discard & Close"
  cancelLabel="Keep Editing"
  [dangerous]="true"
  (cancelAction)="showConfirmClose.set(false)"
  (confirm)="confirmClose()"
/>

<catbee-container-studio-confirm-dialog
  [open]="clearTarget() !== null"
  [title]="clearTarget() === 'volumes' ? 'Clear Volumes' : 'Clear Environment Variables'"
  [message]="
    clearTarget() === 'volumes'
      ? 'Remove all configured volume mappings?'
      : 'Remove all configured environment variables?'
  "
  confirmLabel="Clear All"
  [dangerous]="true"
  (cancelAction)="clearTarget.set(null)"
  (confirm)="confirmClear()"
/>
