<catbee-container-studio-menu [open]="isOpen()" [alignment]="alignment()" [style]="menuStyle()" (dismissed)="close()">
  <button
    #triggerBtn
    menuTrigger
    type="button"
    class="catbee-dropdown-trigger"
    [class.is-open]="isOpen()"
    [class.is-disabled]="disabled()"
    [disabled]="disabled()"
    [id]="triggerId()"
    [attr.aria-label]="ariaLabel() || selectedLabel()"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-haspopup]="'listbox'"
    role="combobox"
    (click)="onTriggerClick($event)"
    (keydown)="onKeyDown($event)"
  >
    @if (selectedOption()?.icon; as icon) {
      <span class="mat-icon-filled trigger-icon" aria-hidden="true">{{ icon }}</span>
    }
    <span class="trigger-label" [class.is-placeholder]="!selectedOption()">
      {{ selectedLabel() }}
    </span>
    <span class="mat-icon-filled trigger-arrow" [class.is-open]="isOpen()" aria-hidden="true">
      keyboard_arrow_down
    </span>
  </button>

  <div
    menuContent
    class="catbee-dropdown-list"
    role="listbox"
    [id]="listboxId"
    [attr.aria-label]="ariaLabel() || selectedLabel()"
    (mouseleave)="activeIndex.set(-1)"
  >
    @for (option of options(); track option.value; let i = $index) {
      <button
        type="button"
        role="option"
        class="catbee-dropdown-item"
        [class.is-selected]="isSelected(option.value)"
        [class.is-active]="activeIndex() === i"
        [class.is-disabled]="option.disabled"
        [disabled]="option.disabled"
        [attr.aria-selected]="isSelected(option.value)"
        (click)="selectOption(option)"
      >
        @if (option.icon) {
          <span class="mat-icon-filled item-icon" aria-hidden="true">{{ option.icon }}</span>
        }
        <div class="item-content">
          <span class="item-label">{{ option.label }}</span>
          @if (option.description) {
            <span class="item-desc">{{ option.description }}</span>
          }
        </div>
        @if (isSelected(option.value)) {
          <span class="mat-icon-filled item-check" aria-hidden="true">check</span>
        }
      </button>
    }
  </div>
</catbee-container-studio-menu>
