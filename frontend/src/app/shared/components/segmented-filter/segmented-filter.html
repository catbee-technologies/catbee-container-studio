<div class="filter-group" role="group" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="filter-btn"
      [class.active]="activeValue() === option.value"
      (click)="onSelect(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
