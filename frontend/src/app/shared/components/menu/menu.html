<div class="menu-anchor" (mousedown)="$event.stopPropagation()">
  <ng-content select="[menuTrigger]" />

  <ng-template #menuTemplate>
    <div
      class="options-menu"
      [style]="style()"
      [attr.role]="contentRole()"
      [attr.tabIndex]="contentRole() === 'menu' ? -1 : null"
      tabindex="-1"
      (mousedown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
      (keydown)="onContentKeydown($event); $event.stopPropagation()"
    >
      <ng-content select="[menuContent]" />
    </div>
  </ng-template>
</div>
