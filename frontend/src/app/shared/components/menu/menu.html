<div class="menu-anchor" (mousedown)="$event.stopPropagation()">
  <ng-content select="[menuTrigger]" />

  <ng-template #menuTemplate>
    <div
      class="options-menu"
      [style]="style()"
      role="menu"
      tabindex="-1"
      (mousedown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <ng-content select="[menuContent]" />
    </div>
  </ng-template>
</div>
