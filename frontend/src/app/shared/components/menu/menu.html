<div class="menu-anchor" (mousedown)="$event.stopPropagation()">
  <ng-content select="[menuTrigger]" />

  @if (open()) {
    <div
      class="options-menu"
      [class.menu-top]="placement() === 'top'"
      [class.menu-bottom]="placement() === 'bottom'"
      [style.min-width]="minWidth()"
      role="menu"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <ng-content select="[menuContent]" />
    </div>
  }
</div>
