@if (rows().length === 0) {
  <catbee-container-studio-empty-state
    [icon]="emptyIcon()"
    [message]="emptyMessage()"
    [hint]="emptyHint()"
    size="small"
    [style]="{ 'min-height': 'unset' }"
  />
} @else {
  @if (showPasteHint()) {
    <p class="env-paste-hint">
      💡 Tip: You can paste lines from a .env file into any field to populate multiple variables at once.
    </p>
  }
  <div class="env-rows-container">
    @for (row of fields(); track row) {
      @let rowError = fieldError(row.key());
      <div class="row-inputs">
        <input
          id="env-key-{{ $index }}"
          type="text"
          class="field-input col-key-input"
          [class.is-invalid]="rowError !== null"
          [attr.aria-invalid]="rowError !== null"
          [attr.aria-describedby]="rowError ? 'env-error-' + $index : null"
          [placeholder]="keyPlaceholder()"
          [formField]="row.key"
          (paste)="onPaste($event, $index)"
        />
        <span class="row-separator" aria-hidden="true">=</span>
        <input
          id="env-value-{{ $index }}"
          type="text"
          class="field-input col-value-input"
          [placeholder]="valuePlaceholder()"
          [formField]="row.value"
          (paste)="onPaste($event, $index)"
        />
        <button
          type="button"
          class="catbee-action-btn icon-only no-bg"
          aria-label="Remove environment variable"
          [disabled]="disabled()"
          (click)="removeRow($index)"
        >
          <span class="mat-icon-filled" aria-hidden="true">close</span>
        </button>
      </div>
      @if (rowError) {
        <p id="env-error-{{ $index }}" class="row-error" aria-live="polite">{{ rowError }}</p>
      }
    }
  </div>
}
