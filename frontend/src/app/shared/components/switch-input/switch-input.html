<label class="switch-toggle" [class.disabled]="disabled()">
  <input
    type="checkbox"
    role="switch"
    [attr.id]="inputId() || null"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="toggleChecked()"
    (blur)="touch.emit()"
  />
  <span class="switch-slider" aria-hidden="true"></span>
  @if (label()) {
    <span class="no-select">{{ label() }}</span>
  }
</label>
