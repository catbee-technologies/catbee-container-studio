<label class="switch-toggle" [class.is-disabled]="disabled()">
  <input type="checkbox" [checked]="checked()" [disabled]="disabled()" (change)="toggleChecked()" />
  <span class="switch-slider" aria-hidden="true"></span>
  @if (label()) {
    <span class="no-select">{{ label() }}</span>
  }
</label>
