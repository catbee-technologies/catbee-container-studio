@if (isLoading()) {
  <catbee-container-studio-empty-state
    [icon]="'hourglass_empty'"
    [message]="loadingMessage()"
    [showLoader]="true"
    size="small"
    [style]="{ 'min-height': 'unset' }"
  />
} @else if (rows().length === 0) {
  <catbee-container-studio-empty-state
    [icon]="emptyIcon()"
    [message]="emptyMessage()"
    [hint]="emptyHint()"
    size="small"
    [style]="{ 'min-height': 'unset' }"
  />
} @else {
  <p class="field-group-hint">Enter "0" to assign a randomly generated host port.</p>

  <div class="port-rows-container">
    @for (port of rows(); track $index) {
      <div class="port-row" [class.editable-row]="allowAdd()">
        <input
          id="port-host-{{ $index }}"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="5"
          class="field-input port-input"
          placeholder="Host port"
          [value]="port.hostPort"
          [disabled]="disabled()"
          (keydown)="onPortKeydown($event)"
          (input)="onPortHostInput($event, $index)"
        />

        @if (allowAdd()) {
          <span class="port-separator" aria-hidden="true">:</span>
          <input
            id="port-container-{{ $index }}"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="5"
            class="field-input port-container-input"
            placeholder="Container port"
            [value]="port.containerPort"
            [disabled]="disabled()"
            (keydown)="onPortKeydown($event)"
            (input)="onPortContainerInput($event, $index)"
          />
          <select
            class="field-select port-protocol-select"
            [value]="port.protocol"
            [disabled]="disabled()"
            (change)="setProtocol($index, $any($event.target).value)"
          >
            <option value="tcp">tcp</option>
            <option value="udp">udp</option>
          </select>
          <button
            type="button"
            class="catbee-action-btn icon-only no-bg"
            aria-label="Remove port mapping"
            [disabled]="disabled()"
            (click)="removeRow($index)"
          >
            <span class="mat-icon-filled" aria-hidden="true">close</span>
          </button>
        } @else {
          <span class="port-suffix mono" aria-hidden="true">:{{ port.containerPort }}/{{ port.protocol }}</span>
        }
      </div>
    }
  </div>
}
