@if (rows().length === 0) {
  <catbee-container-studio-empty-state
    [icon]="emptyIcon()"
    [message]="emptyMessage()"
    [hint]="emptyHint()"
    size="small"
    [style]="{ 'min-height': 'unset' }"
  />
} @else {
  <div class="volume-rows-container">
    @for (volume of fields(); track volume) {
      @let hostError = fieldError(volume.hostPath());
      @let containerError = fieldError(volume.containerPath());
      <div class="volume-row">
        <div class="path-input">
          <input
            id="volume-host-{{ $index }}"
            type="text"
            class="field-input volume-host-input"
            [class.is-invalid]="hostError !== null"
            [attr.aria-invalid]="hostError !== null"
            [attr.aria-describedby]="hostError ? 'volume-host-error-' + $index : null"
            [placeholder]="hostPlaceholder()"
            [formField]="volume.hostPath"
          />
          <button
            type="button"
            class="catbee-action-btn icon-only"
            aria-label="Browse for host folder"
            [disabled]="disabled()"
            (click)="pickHostPath($index)"
          >
            <span class="mat-icon-filled" aria-hidden="true">folder_open</span>
          </button>
        </div>
        <span class="row-separator" aria-hidden="true">:</span>
        <input
          id="volume-container-{{ $index }}"
          type="text"
          class="field-input volume-container-input"
          [class.is-invalid]="containerError !== null"
          [attr.aria-invalid]="containerError !== null"
          [attr.aria-describedby]="containerError ? 'volume-container-error-' + $index : null"
          [placeholder]="containerPlaceholder()"
          [formField]="volume.containerPath"
        />
        <catbee-container-studio-switch-input [formField]="volume.readOnly" label="Read-only" />
        <button
          type="button"
          class="catbee-action-btn icon-only no-bg"
          aria-label="Remove volume mapping"
          [disabled]="disabled()"
          (click)="removeRow($index)"
        >
          <span class="mat-icon-filled" aria-hidden="true">close</span>
        </button>
        @if (hostError) {
          <p id="volume-host-error-{{ $index }}" class="row-error" aria-live="polite">{{ hostError }}</p>
        }
        @if (containerError) {
          <p id="volume-container-error-{{ $index }}" class="row-error container-error" aria-live="polite">
            {{ containerError }}
          </p>
        }
      </div>
    }
  </div>
}
