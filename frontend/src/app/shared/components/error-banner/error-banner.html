@if (visible()) {
  @let formatted = formattedError();
  <section class="catbee-error-banner {{ size() }}" role="alert">
    <div class="catbee-error-message">
      <span>{{ formatted.message }}</span>
      @if (formatted.details; as details) {
        <details class="error-details">
          <summary>Details</summary>
          <pre>{{ details }}</pre>
        </details>
      }
    </div>

    @if (closable()) {
      <button type="button" class="catbee-action-btn icon-only close-btn" (click)="onClose()" aria-label="Close">
        <span class="mat-icon-filled" aria-hidden="true">close</span>
      </button>
    }
  </section>
}
