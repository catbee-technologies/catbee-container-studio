<ng-template #dialogTemplate>
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
  <div
    class="catbee-base-panel catbee-dialog"
    role="dialog"
    aria-modal="true"
    [cdkTrapFocus]="trapFocus()"
    [cdkTrapFocusAutoCapture]="trapFocus()"
    [attr.aria-labelledby]="titleId"
    (click)="$event.stopPropagation()"
    [style]="style()"
  >
    <div class="catbee-dialog-header">
      <h2 class="catbee-dialog-title" [id]="titleId">{{ title() }}</h2>
    </div>

    <div class="catbee-dialog-body">
      <div class="catbee-confirm-dialog-message">
        <p class="catbee-confirm-dialog-text">{{ localMessage() }}</p>

        @if (localNote(); as noteText) {
          <div [class]="'catbee-confirm-dialog-note note-' + noteType()">
            <p>{{ noteText }}</p>
          </div>
        }
      </div>
    </div>

    <div class="catbee-dialog-footer-actions">
      <button type="button" class="catbee-action-btn secondary" (click)="onCancel()">
        {{ cancelLabel() }}
      </button>

      <button
        type="button"
        class="catbee-action-btn"
        [class.primary]="!dangerous()"
        [class.danger]="dangerous()"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</ng-template>
