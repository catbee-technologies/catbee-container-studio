<ng-template #dialogTemplate>
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
  <article
    class="catbee-base-panel catbee-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    (click)="$event.stopPropagation()"
    [style]="style()"
  >
    <header class="catbee-dialog-header">
      <h2 class="catbee-dialog-title" [id]="titleId">{{ title() }}</h2>

      <button
        type="button"
        class="catbee-dialog-close"
        aria-label="Close dialog"
        [disabled]="!closable()"
        (click)="onClose()"
      >
        <span class="mat-icon-filled" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="catbee-dialog-body">
      <ng-content select="[catbeeDialogBody]" />
    </div>

    <div class="catbee-dialog-footer-actions">
      <ng-content select="[catbeeDialogFooter]" />
    </div>
  </article>
</ng-template>
