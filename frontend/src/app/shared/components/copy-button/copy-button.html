<button
  type="button"
  class="catbee-action-btn icon-only copy-button"
  [class.is-copied]="status() === 'copied'"
  [class.is-failed]="status() === 'failed'"
  class="{{ size() + ' ' + className() }}"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  [catbeeTooltip]="buttonTitle()"
  catbeeTooltipPosition="top"
  (click)="copy()"
>
  <span class="mat-icon-filled" aria-hidden="true">{{ iconName() }}</span>
</button>
