<div class="empty-state {{ size() }}">
  @if (showLoader()) {
    <ng-catbee-loader
      class="init-loader-host"
      [name]="emptyStateLoaderName"
      [message]="message()"
      size="medium"
      [fullscreen]="false"
      [backgroundColor]="'transparent'"
      [loaderColor]="loaderColor() ? '#087ea4' : '#d9f7ff'"
    />
  } @else {
    <span class="mat-icon-filled empty-icon" aria-hidden="true">
      {{ icon() }}
    </span>
    <p>{{ message() }}</p>
  }
  @if (hint()) {
    <span class="empty-hint">{{ hint() }}</span>
  }
</div>
