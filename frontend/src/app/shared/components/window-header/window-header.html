@let isFullscreen = isWindowFullscreen();
@let isMaximized = isWindowMaximized();

<header
  class="titlebar"
  [class.is-macos]="isMacOS"
  [class.is-fullscreen]="isFullscreen"
  role="banner"
  aria-label="Application title bar"
>
  @if (isMacOS && !isFullscreen) {
    <div class="macos-controls-spacer" aria-hidden="true"></div>
  }

  <div class="titlebar-left" [class.is-fullscreen]="isFullscreen">
    @if (!isMacOS && !isFullscreen) {
      <button type="button" class="menu-btn" (click)="showMenu()" aria-label="Show menu">
        <span class="mat-icon-filled" aria-hidden="true">menu</span>
      </button>
    }
    <img src="favicon.ico" alt="CatBee Container Studio logo" class="brand-icon" aria-hidden="true" />
    <span class="product-name">CatBee Container Studio</span>
  </div>

  @if (isMacOS) {
    <div class="titlebar-actions no-drag" aria-label="Theme switcher">
      <catbee-container-studio-theme-switch />
    </div>
  }

  @if (!isMacOS) {
    <div class="titlebar-actions no-drag" aria-label="Window controls">
      <catbee-container-studio-theme-switch />
      <button type="button" class="window-btn" (click)="minimizeWindow()" aria-label="Minimize window">
        <span class="mat-icon-filled" aria-hidden="true">horizontal_rule</span>
      </button>
      <button
        type="button"
        class="window-btn"
        (click)="toggleMaximizeWindow()"
        [attr.aria-label]="isMaximized ? 'Restore window' : 'Maximize window'"
      >
        <span class="mat-icon-filled" aria-hidden="true">{{ isMaximized ? 'fullscreen_exit' : 'fullscreen' }}</span>
      </button>
      <button type="button" class="window-btn danger" (click)="closeWindow()" aria-label="Close window">
        <span class="mat-icon-filled" aria-hidden="true">close</span>
      </button>
    </div>
  }
</header>
