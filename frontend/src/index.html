<!doctype html>
<html lang="en" data-theme="dark" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <title>CatBee Container Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <script>
      (function () {
        try {
          const THEME_KEY = 'catbee.app.ui.theme';
          const IS_DEFAULT_THEME_KEY = 'catbee.app.ui.default';
          let theme = localStorage.getItem(THEME_KEY);
          let isDefaultTheme = localStorage.getItem(IS_DEFAULT_THEME_KEY);
          if (theme !== 'light' && theme !== 'dark') {
            theme = 'dark';
          }
          if (isDefaultTheme !== 'true' && isDefaultTheme !== 'false') {
            isDefaultTheme = 'true';
            localStorage.setItem(IS_DEFAULT_THEME_KEY, isDefaultTheme);
          }
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const useSystem = isDefaultTheme !== 'false';
          if (useSystem) {
            theme = prefersDark ? 'dark' : 'light';
          }
          localStorage.setItem(THEME_KEY, theme);
          document.documentElement.dataset['theme'] = theme;
          document.documentElement.classList.toggle('theme-dark', theme === 'dark');
          document.documentElement.classList.toggle('theme-light', theme === 'light');
        } catch {
          // Ignore theme initialization errors.
        }
      })();
    </script>
    <catbee-container-studio-root></catbee-container-studio-root>
  </body>
</html>
